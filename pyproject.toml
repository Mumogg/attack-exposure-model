[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-exposure-model"
version = "0.1.0"
description = "Prototipo de tesis: evaluación de exposición a técnicas MITRE ATT&CK asistida por IA (solo reproducibilidad)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sebastián Murillo Mora" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "mitreattack-python>=6.3",
    "google-genai>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aem = "aem.cli:app"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["aem*", "eval*"]

[tool.setuptools.package-data]
aem = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
