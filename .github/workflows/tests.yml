# Tests on every push and pull request. No secrets and no API key: the tests never call the Gemini API
# (tests/conftest.py fails any test that tries). `aem fetch-data` downloads ATT&CK v19.2 (checked by SHA-256)
# so that the ATT&CK-dependent tests run instead of being skipped; the CISA texts are already versioned.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # provenance compares frozen files with the run's commit
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Download ATT&CK v19.2
        run: aem fetch-data
      - name: Run tests (none may be skipped for lack of ATT&CK)
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rs | tee pytest.log
          if grep -E "SKIPPED.*(ATT&CK v19.2 no descargado|requiere ATT&CK)" pytest.log; then
            echo "::error::Hay tests omitidos por falta de ATT&CK"
            exit 1
          fi

  # requirements.lock was generated with Python 3.14.7 (the interpreter of the thesis runs). It does not install
  # on 3.11 (numpy 2.5.4 and contourpy 1.4.0 have no 3.11 wheels), so it is checked with the same version.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # provenance compares frozen files with the run's commit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - name: Install the exact versions
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
          pip check
      - name: Download ATT&CK v19.2
        run: aem fetch-data
      - name: Run tests
        run: python -m pytest -q
