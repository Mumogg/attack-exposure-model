# CONFIRMADA por Sebas (2026-10-18). Se diseñó antes de generar resultados; sus brechas definen el denominador
# del indicador 3 y la verdad de terreno del indicador 2 (`coverage_design`).
# Organización FICTICIA para la simulación de la tesis (ver docs/DECISIONS.md D-22).
# Esquema propio simplificado, inspirado en DeTT&CT (https://github.com/rabobank-cdc/DeTTECT).
# Cubre las técnicas de referencia de los tres escenarios (Gunra, Interlock, Akira) con una mezcla
# de cubiertas, parciales y sin cobertura. Los nombres de fuentes de datos son componentes de datos de ATT&CK v19.2.

organization: "Distribuidora Ficticia del Valle S.A."

assets:
  - {id: vpn-fw,       name: "Firewall y VPN SSL perimetral",          criticality: alta,  processes_regulated_data: false, exposure: internet}
  - {id: vdi-portal,   name: "Portal de autenticación VDI",            criticality: alta,  processes_regulated_data: false, exposure: internet}
  - {id: m365,         name: "Correo, OneDrive y SharePoint (nube)",   criticality: alta,  processes_regulated_data: true,  exposure: internet}
  - {id: ad-dc,        name: "Controladores de dominio (AD)",          criticality: alta,  processes_regulated_data: false, exposure: interna}
  - {id: erp-db,       name: "ERP y base de datos de clientes",        criticality: alta,  processes_regulated_data: true,  exposure: interna}
  - {id: file-srv,     name: "Servidores de archivos y NAS",           criticality: media, processes_regulated_data: true,  exposure: interna}
  - {id: workstations, name: "Estaciones de trabajo de usuarios",      criticality: media, processes_regulated_data: false, exposure: interna}
  - {id: backup,       name: "Infraestructura de respaldo",            criticality: alta,  processes_regulated_data: true,  exposure: aislada}
  - {id: lab-dev,      name: "Entorno de pruebas",                     criticality: baja,  processes_regulated_data: false, exposure: aislada}

